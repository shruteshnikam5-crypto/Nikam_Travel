<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nikam Travel | Secure Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
  <h2>Nikam Travel</h2>
  <nav class="nav">
    <div class="nav-left">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>
</header>

<section class="auth-pro">
  <div class="auth-left">
    <h1>Welcome Back</h1>
    <p>Secure login and instant booking experience.</p>
    <img src="pexels-safi-erneste-18029609.jpg" alt="Bus">
  </div>

  <div class="auth-box">
    <div class="form-slider" id="formSlider">
      <form class="auth-form">
        <h2>Create Account</h2>
        <input type="text" id="rname" placeholder="Full Name" required>
        <input type="number" id="rage" placeholder="Age" min="18" required>
        <input type="tel" id="rmobile" placeholder="Mobile Number" required>
        <input type="email" id="remail" placeholder="Email Address" required>
        <input type="password" id="rpassword" placeholder="Password" required>
        <button type="button" onclick="registerUser()">Register</button>
        <p>Already have account? <span onclick="slideToLogin()">Login</span></p>
      </form>

      <form class="auth-form">
        <h2>Login Account</h2>
        <input type="tel" id="lmobile" placeholder="Mobile Number" required>
        <input type="password" id="lpassword" placeholder="Password" required>
        <button type="button" onclick="loginUser()">Login</button>
        <p>Don't have account? <span onclick="slideToRegister()">Register</span></p>
      </form>
    </div>
  </div>
</section>

<footer class="footer">
  <p>© 2026 Nikam Travel. All Rights Reserved.</p>
</footer>

<script src="data.js"></script>
<script>
const nikamNextPage = new URLSearchParams(window.location.search).get("next") || "route.html";

if (getNikamSession()) {
  window.location.href = nikamNextPage;
}

function slideToLogin() {
  document.getElementById("formSlider").style.transform = "translateX(-50%)";
}

function slideToRegister() {
  document.getElementById("formSlider").style.transform = "translateX(0)";
}

async function registerUser() {
  const name = document.getElementById("rname").value.trim();
  const age = Number(document.getElementById("rage").value);
  const mobile = document.getElementById("rmobile").value.trim();
  const email = document.getElementById("remail").value.trim().toLowerCase();
  const password = document.getElementById("rpassword").value;

  if (!name || !age || !mobile || !email || !password) {
    alert("Please fill all fields.");
    return;
  }

  if (!Number.isInteger(age) || age < 18) {
    alert("Age must be 18 or above.");
    return;
  }

  if (!isValidNikamMobile(mobile)) {
    alert("Enter a valid 10 digit mobile number.");
    return;
  }

  if (!isValidNikamEmail(email)) {
    alert("Enter a valid email address.");
    return;
  }

  if (!isStrongNikamPassword(password)) {
    alert("Password must be at least 6 characters.");
    return;
  }

  try {
    const response = await fetch("/api/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, age, mobile, email, password })
    });
    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.message || "Registration failed.");
    }

    const users = readNikamUsers().filter((user) => user.mobile !== mobile && user.email !== email);
    users.push(result.user);
    saveNikamUsers(users);
    alert("Registration successful. Please login.");
    slideToLogin();
  } catch (err) {
    alert(err.message || "Registration failed. Please check server.");
  }
}

async function loginUser() {
  const mobile = document.getElementById("lmobile").value.trim();
  const password = document.getElementById("lpassword").value;

  if (!isValidNikamMobile(mobile) || !password) {
    alert("Enter mobile number and password.");
    return;
  }

  try {
    const response = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mobile, password })
    });
    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.message || "Invalid mobile number or password.");
    }

    setNikamSession(result.user);
    setNikamAuthToken(result.token);
    alert("Login successful.");
    window.location.href = nikamNextPage;
  } catch (err) {
    alert(err.message || "Login failed. Please check server.");
  }
}
</script>
</body>
</html>
