<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nikam Travel | Premium Routes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
  <h2>Nikam Travel</h2>
  <nav class="nav">
    <div class="nav-left">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="mybookings.html">My Bookings</a>
    </div>
    <div class="nav-right">
      <a href="#" class="admin-btn" onclick="logoutNikamCustomer()">Logout</a>
    </div>
  </nav>
</header>

<section class="route-pro">
  <h1>Search & Book Premium Buses</h1>
  <div class="route-box">
    <input type="text" value="Chhatrapati Sambhajinagar" disabled aria-label="From city">
    <select id="toCity">
      <option value="">To</option>
    </select>
    <input type="date" id="journeyDate" aria-label="Travel date">
    <select id="busType">
      <option value="">Bus Type</option>
      <option value="AC">AC</option>
      <option value="Non-AC">Non-AC</option>
    </select>
    <button class="search-btn" type="button" onclick="filterRoutes()">Find Bus</button>
  </div>
  <div id="routeList" class="route-list"></div>
</section>

<script src="data.js"></script>
<script>
const nikamCustomer = requireNikamCustomer();
const today = new Date().toISOString().split("T")[0];
const dateInput = document.getElementById("journeyDate");
const routeList = document.getElementById("routeList");

function initRoutes() {
  if (!nikamCustomer) return;
  dateInput.min = today;
  dateInput.value = dateInput.value && dateInput.value >= today ? dateInput.value : today;
  const destinations = Array.from(new Set(NIKAM_BUSES.filter((bus) => bus.active !== false).map((bus) => bus.to))).sort();
  document.getElementById("toCity").innerHTML = '<option value="">To</option>' + destinations.map((city) => `<option>${escapeNikamHtml(city)}</option>`).join("");
  displayRoutes(NIKAM_BUSES.filter((bus) => bus.active !== false));
}

function filterRoutes() {
  const to = document.getElementById("toCity").value;
  const type = document.getElementById("busType").value;
  const date = dateInput.value;

  if (!date) {
    alert("Please select travel date.");
    return;
  }

  if (date < today) {
    alert("Past travel dates are not allowed.");
    dateInput.value = today;
    return;
  }

  displayRoutes(NIKAM_BUSES.filter((bus) =>
    bus.active !== false &&
    (!to || bus.to === to) &&
    (!type || bus.type === type)
  ));
}

function displayRoutes(buses) {
  routeList.innerHTML = "";

  if (!buses.length) {
    routeList.textContent = "No buses found for this search.";
    return;
  }

  buses.forEach((bus) => {
    const div = document.createElement("div");
    div.className = "bus-card-pro";
    div.innerHTML = `
      <div class="bus-info">
        <h3>${escapeNikamHtml(bus.name)}</h3>
        <p><strong>${escapeNikamHtml(bus.busNumber)}</strong></p>
        <p><strong>${escapeNikamHtml(bus.from)} -> ${escapeNikamHtml(bus.to)}</strong></p>
        <p>Departure: ${escapeNikamHtml(bus.departureTime)} | Arrival: ${escapeNikamHtml(bus.arrivalTime)}</p>
        <p>Duration: ${escapeNikamHtml(bus.duration)} | Distance: ${escapeNikamHtml(bus.distance)}</p>
        <p>Type: ${escapeNikamHtml(bus.type)} | Seat: ${escapeNikamHtml(bus.seatType)}</p>
        <p>Available Seats: ${escapeNikamHtml(bus.availableSeats)}</p>
        <p>Amenities: ${bus.amenities.map(escapeNikamHtml).join(", ")}</p>
        <p class="price">Rs.${escapeNikamHtml(bus.price)}</p>
      </div>
      <div><button type="button" onclick="selectBus('${escapeNikamHtml(bus.id)}')">Book Now</button></div>
    `;
    routeList.appendChild(div);
  });
}

function selectBus(busId) {
  const bus = findNikamBus(busId);
  const travelDate = dateInput.value;

  if (!bus) {
    alert("Selected bus is not available.");
    return;
  }

  if (!travelDate || travelDate < today) {
    alert("Please select a valid travel date.");
    return;
  }

  setNikamBookingState({
    userId: nikamCustomer.id,
    bus,
    travelDate,
    seats: [],
    passenger: {
      name: nikamCustomer.name,
      mobile: nikamCustomer.mobile,
      email: nikamCustomer.email,
      age: nikamCustomer.age
    }
  });

  window.location.href = "seat.html";
}

initRoutes();
</script>
</body>
</html>
