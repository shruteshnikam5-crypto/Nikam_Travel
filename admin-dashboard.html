<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | Nikam Travel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Admin CSS -->
    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <!-- ===== HEADER ===== -->
    <header class="admin-header">
        <div class="header-left">
            <h2>🛠 Nikam Travel - Admin</h2>
        </div>

        <div class="header-right">
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </header>

    <!-- ===== NAVIGATION ===== -->
    <nav class="admin-nav">
        <a href="admin-dashboard.html" class="active">Dashboard</a>
        <a href="admin-manage-bus.html">Manage Bus</a>
        <a href="admin-bookings.html">Bookings</a>
    </nav>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="admin-content">
        
        <div class="dashboard-card">
            <h3>Welcome Admin 👋</h3>
            <p>
                From here you can manage buses, control seat availability, 
                and monitor customer bookings.
            </p>
        </div>

        <div class="dashboard-grid">
            
            <div class="card">
                <h4>🚌 Manage Buses</h4>
                <p>Add, edit or control bus seats.</p>
                <a href="admin-manage-bus.html" class="card-btn">Go</a>
            </div>

            <div class="card">
                <h4>📑 View Bookings</h4>
                <p>Check all customer bookings.</p>
                <a href="admin-bookings.html" class="card-btn">Go</a>
            </div>

        </div>

    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="admin-footer">
        <p>© 2026 Nikam Travel Admin Panel</p>
    </footer>

    <script src="admin.js"></script>

</body>
</html>
