<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookings | Nikam Travel Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
<header class="admin-header">
  <h2>Bookings</h2>
  <button class="logout-btn" onclick="logout()">Logout</button>
</header>

<nav class="admin-nav">
  <a href="admin-dashboard.html">Dashboard</a>
  <a href="admin-manage-bus.html">Buses</a>
  <a href="admin-bookings.html" class="active">Bookings</a>
</nav>

<section class="content">
  <div class="dashboard-card">
    <h3>Admin Bookings</h3>
    <table>
      <thead>
        <tr>
          <th>Booking ID</th>
          <th>Customer</th>
          <th>Mobile</th>
          <th>Bus</th>
          <th>Bus Number</th>
          <th>From</th>
          <th>To</th>
          <th>Travel Date</th>
          <th>Seats</th>
          <th>Amount</th>
          <th>Payment</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="bookingTable"><tr><td colspan="12">Loading...</td></tr></tbody>
    </table>
  </div>

  <div class="dashboard-card">
    <h3>Users</h3>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Mobile</th>
          <th>Registration Date</th>
          <th>Booking Count</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="userTable"><tr><td colspan="6">Loading...</td></tr></tbody>
    </table>
  </div>
</section>

<script src="admin.js"></script>
</body>
</html>
